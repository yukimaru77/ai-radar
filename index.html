<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レーダー全部 2026-08-27〜28</title>
<style>
:root { --bg:#0f1115; --card:#1a1d24; --ink:#e8eaed; --dim:#9aa3ad; --acc:#7dd3fc; --x:#67e8f9; --en:#86efac; --cn:#fbbf24; --line:#2a2f3a; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin:0; font: 16px/1.65 ui-sans-serif, system-ui, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--ink); }
main { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; letter-spacing: .02em; }
.sub { color:var(--dim); margin: 0 0 22px; font-size: 14px; }
.toc { display:flex; flex-wrap:wrap; gap:8px; margin: 0 0 28px; }
.toc a { display:inline-block; padding: 6px 12px; border-radius: 999px; background:#232833; color:var(--acc); text-decoration:none; font-size:13px; border:1px solid var(--line); }
.toc a:hover { background:#2c3340; }
.now { background:var(--card); border-radius: 16px; padding: 20px 22px; margin-bottom: 22px; border:1px solid var(--line); }
.now h2 { margin:0 0 12px; font-size:15px; color:var(--acc); letter-spacing:.04em; }
.now ol { margin:0; padding-left: 1.25em; }
.now li { margin: 12px 0; }
.now b { color:#fff; }
.now a { color:var(--acc); }
.diag { background:var(--card); border-radius: 14px; padding: 16px 18px 20px; margin: 0 0 28px; border:1px solid var(--line); }
.diag h2 { margin:0 0 14px; font-size:15px; color:var(--dim); }
.map { display:grid; gap:10px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .map { grid-template-columns: 1fr 1fr 1fr; } }
.map .box { background:#12151b; border-radius:12px; padding:12px 14px; border:1px solid var(--line); }
.map .box strong { display:block; margin-bottom:6px; font-size:13px; color:var(--acc); }
.map .box span { display:block; font-size:13px; color:#c9cfd6; margin: 3px 0; }
section.block { margin: 0 0 32px; }
section.block > h2 { font-size:18px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.cards { display:flex; flex-direction:column; gap:12px; }
article.card { background:var(--card); border-radius: 14px; padding: 14px 16px 16px; border:1px solid var(--line); }
article.card .meta { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
article.card .tag { font-size:11px; font-weight:700; letter-spacing:.06em; padding: 2px 8px; border-radius: 999px; }
article.card .tag.x { color:#082022; background:var(--x); }
article.card .tag.en { color:#05210f; background:var(--en); }
article.card .tag.cn { color:#2a1c00; background:var(--cn); }
article.card .id { font-size:12px; color:var(--dim); }
article.card p { margin: 0 0 8px; color:#d0d4da; font-size:14.5px; }
article.card p:last-child { margin-bottom:0; }
article.card a { color:var(--acc); word-break: break-all; }
article.card code { font-size: 12.5px; background:#12151b; padding: 1px 5px; border-radius: 4px; }
.repos { display:flex; flex-direction:column; gap:8px; }
.repos a { color:var(--acc); text-decoration:none; }
.repos li { margin: 6px 0; font-size:14px; }
.note { color:var(--dim); font-size:13px; margin-top: 10px; }
.repos .tag { font-size:11px; font-weight:700; letter-spacing:.06em; padding: 2px 8px; border-radius: 999px; }
.repos .tag.x { color:#082022; background:var(--x); }
.repos .tag.en { color:#05210f; background:var(--en); }
.repos .tag.cn { color:#2a1c00; background:var(--cn); }
footer { color:var(--dim); font-size:12px; margin-top: 36px; }
</style>
</head>
